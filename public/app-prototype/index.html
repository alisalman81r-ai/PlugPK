<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05241E">
<!-- Installable app: manifest, home-screen icons, full-screen on iOS -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="plug.pk">
<title>plug.pk App</title>
<meta name="description" content="A working prototype of the plug.pk mobile app: chargers, routes, cars and community for EV drivers in Pakistan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<!-- The real map: MapLibre (same engine as the website), pinned version. The
     library (~800 KB) is NOT loaded here: it would hold up the whole app for a
     screen most launches never open. screens-map.js loads it in the background
     once the app is up (warmMap), and the connections are opened early below. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="stage">
  <aside class="stage-side" aria-label="About this prototype">
    <div class="side-logo" id="side-logo"></div>
    <h2 class="side-title">The plug.pk app, <span style="color:var(--accent-text)">working prototype</span></h2>
    <p class="side-copy">Tap through it like the real thing. It runs on the website’s own data and maths.</p>
    <ul class="side-list" id="side-list"></ul>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm btn-secondary" data-side="light">Light</button>
      <button class="btn btn-sm btn-secondary" data-side="dark">Dark</button>
      <button class="btn btn-sm btn-secondary" data-side="system">Auto</button>
      <button class="btn btn-sm btn-ghost" data-side="restart">Restart tour</button>
    </div>
  </aside>
  <div class="device">
    <div class="app" id="app">
      <div class="statusbar" id="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="sb-r">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .7C5.2.7 2.7 1.8.8 3.6L2 4.9a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3a6.8 6.8 0 0 0-9.2 0l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.5 0-.9.2-1.2.5L8 11.4l1.2-1.3c-.3-.3-.7-.5-1.2-.5Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><path d="M24.5 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>
      <div id="screen" class="layer"></div>
      <div id="tabs"></div>
      <div id="sheet"></div>
      <div id="toast"></div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="icons.js"></script>
<script src="core.js"></script>
<script src="screens-home.js"></script>
<script src="screens-map.js"></script>
<script src="screens-drive.js"></script>
<script src="screens-more.js"></script>
<script src="screens-community.js"></script>
<script>
  // The panel beside the phone (wide screens only).
  document.getElementById('side-logo').innerHTML = logo(26, false)
  document.getElementById('side-list').innerHTML = [
    ['pin', 'Charger map with filters and station pages'],
    ['route', 'Route planner that checks your real range'],
    ['car', `${D.cars.length} cars to browse, favourite and compare`],
    ['timer', 'Charge time and real-range calculators'],
    ['users', 'Community posts, replies and clubs'],
    ['moon', 'Light and dark mode'],
  ].map(([i, t]) => `<li>${ic(i, 18)}${t}</li>`).join('')
  document.querySelectorAll('[data-side]').forEach((b) => b.addEventListener('click', () => {
    const v = b.dataset.side
    if (v === 'restart') { S.onboarded = false; U.onbStep = 0; U.stack = [{ s: 'home' }]; save(); render() }
    else A.theme(v)
  }))
  // Shrink the phone frame to fit short laptop windows (it stays a phone, never full screen).
  function fitDevice() {
    const fit = Math.min(1, (window.innerHeight - 32) / 874)
    document.documentElement.style.setProperty('--fit', Math.max(0.55, fit).toFixed(3))
  }
  fitDevice()
  window.addEventListener('resize', fitDevice)
  render()
  // Fetch the map library and style while the user is on Home, so Stations
  // opens without waiting for them.
  window.addEventListener('load', () => (window.requestIdleCallback || ((cb) => setTimeout(cb, 600)))(() => warmMap()))
  // Installable app: offline support and instant launch (sw.js). Skipped where
  // service workers are unavailable, e.g. a non-secure origin.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}))
    // A new version took over: reload once so every file is from that version,
    // rather than a new script running against an older stylesheet.
    const hadController = Boolean(navigator.serviceWorker.controller)
    let reloaded = false
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController && !reloaded) { reloaded = true; window.location.reload() }
    })
  }
</script>
</body>
</html>
